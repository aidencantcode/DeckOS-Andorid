# DeckOS Android build (docs/13-release-flow.md)
#  - tag v<major>.<phase>.<build> (pushed by tools/ship.ps1) -> signed arm64 APK -> GitHub release
#    (a pre-release for 0.0.x, a normal "Alpha" release from 0.1.0)
#  - manual run (Actions -> Android -> Run workflow)          -> signed APK as a downloadable artifact only
# Every APK is signed with the stable DeckOS test key from the repo secrets, so builds install over each other.
# Toolchain: upstream Pegasus's prebuilt Qt 5.15.10 for Android + NDK r21e (same as upstream's workflow).
name: Android

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write   # create the release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  TOOLS_URL: https://github.com/mmatyas/pegasus-frontend/releases/download/alpha1
  QT_TARGET: android
  QT_VERSION: qt51510
  ABI: arm64-v8a

jobs:
  apk:
    name: APK (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive', fetch-depth: 0, fetch-tags: true}

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Version
        id: ver
        run: |
          v=$(git describe --tags --match 'v[0-9]*' --always)
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "DeckOS ${v#v}"

      - name: Install Qt
        run: |
          .circleci/prepare.sh
          curl -L ${TOOLS_URL}/openssl-111t_android.tar.xz | tar xJf - -C /opt/

      - name: Build
        env:
          BUILDOPTS: ANDROID_ABIS=${{ env.ABI }} FORCE_QT_PNG=1
          MAKEFLAGS: -j4
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: .circleci/build.sh

      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.DECKOS_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Repo secret DECKOS_KEYSTORE_B64 is missing (docs/13-release-flow.md)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/deckos.p12"

      # Gradle's downloads (Android build tools and their libraries) kept between runs, so a build
      # doesn't depend on Maven Central answering every time (it rate-limits GitHub's machines)
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src/app/platform/android/build.gradle', 'src/app/platform/android/gradle.properties') }}
          restore-keys: gradle-

      - name: Package (signed)
        env:
          KS_PASS: ${{ secrets.DECKOS_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DECKOS_KEY_ALIAS }}
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: /opt/${QT_VERSION}_${QT_TARGET}/bin/androiddeployqt
          --input src/app/android-pegasus-fe-deployment-settings.json
          --output ${PWD}/installdir
          --android-platform android-30
          --gradle
          --sign "$RUNNER_TEMP/deckos.p12" "$KS_ALIAS"
          --storetype pkcs12
          --storepass "$KS_PASS"
          --keypass "$KS_PASS"

      - name: Stage
        id: apk
        run: |
          name="DeckOS_${{ steps.ver.outputs.version }}_${{ steps.ver.outputs.sha }}_arm64"
          cp installdir/build/outputs/apk/release/installdir-release-signed.apk "dist/$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/deckos.p12"
          ls -l dist

      - name: Verify signature
        run: |
          # Must be the DeckOS test key (SHA-256 DD:9B:25:48:...:3F:49, secrets/README.txt) with a v2 signature.
          apksigner=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "dist/${{ steps.apk.outputs.name }}.apk" \
            | grep -E "^Verified using v[12] scheme|^Signer #1 certificate (DN|SHA-256)"
          "$apksigner" verify --print-certs "dist/${{ steps.apk.outputs.name }}.apk" \
            | grep -qi "SHA-256 digest: dd9b2548e23c515ba53b1ff17d2a2dad3fbd3815321bfb0a671138f7dc983f49" \
            || { echo "::error::APK is not signed with the DeckOS test key"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Release notes = this version's section of CHANGELOG.md ("## <version> — <date>" up to the next "## ").
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {f=1; next} f && /^## / {exit} f {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          cat >> notes.md <<EOF

          ---
          **Install:** on the handheld, download the \`.apk\` below and open it. It installs over earlier DeckOS test builds and keeps your settings.
          **Found a bug?** [Open a test report](${{ github.server_url }}/${{ github.repository }}/issues/new/choose).
          EOF
          # 0.0.x builds are pre-releases; from 0.1.0 (the first Stable Alpha) they are normal releases
          kind="--prerelease"
          title="DeckOS $VERSION"
          case "$VERSION" in
            0.0.*) ;;
            *) kind="--latest"; title="DeckOS $VERSION (Alpha)" ;;
          esac
          gh release create "$GITHUB_REF_NAME" "dist/${{ steps.apk.outputs.name }}.apk" \
            --repo "$GITHUB_REPOSITORY" --verify-tag $kind \
            --title "$title" --notes-file notes.md
