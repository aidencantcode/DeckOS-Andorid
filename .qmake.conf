TOP_SRCDIR=$$PWD
TOP_BUILDDIR=$$shadowed($$PWD)

# DECKOS: the version is the newest DeckOS tag v<major>.<phase>.<build> without the "v"
# (e.g. 0.1.4, or 0.1.4-3-gabc1234 after it); upstream's alphaN tags are ignored. docs/13-release-flow.md
GIT_REVISION = $$system(git \
    --git-dir \"$${TOP_SRCDIR}/.git\" \
    --work-tree \"$${TOP_SRCDIR}\" \
    describe \
    --always --dirty --tags --match \"v[0-9]*\")
GIT_REVISION = $$replace(GIT_REVISION, ^v, )

# DECKOS: Android versionCode = major*1000000 + phase*1000 + build of that tag (1 before the first tag),
# so every shipped build installs as an update of the previous one.
defineReplace(deckosVersionCode) {
    rev = $$1
    code = 1
    contains(rev, ^[0-9]+[.][0-9]+[.][0-9]+.*) {
        tag = $$section(rev, -, 0, 0)
        code = $$section(tag, ., 0, 0)$$format_number($$section(tag, ., 1, 1), width=3 zeropad)$$format_number($$section(tag, ., 2, 2), width=3 zeropad)
        code = $$replace(code, ^0+, )
        isEmpty(code): code = 1
    }
    return($$code)
}
DECKOS_VERSION_CODE = $$deckosVersionCode($$GIT_REVISION)

GIT_DATE = $$system(git \
    --git-dir \"$${TOP_SRCDIR}/.git\" \
    --work-tree \"$${TOP_SRCDIR}\" \
    log \
    -1 \
    --format=%cd \
    --date=short)

GIT_COMMIT_CNT = $$system(git \
    --git-dir \"$${TOP_SRCDIR}/.git\" \
    --work-tree \"$${TOP_SRCDIR}\" \
    rev-list \
    --count HEAD)

COMMON_DEFINES = \
    QT_DEPRECATED_WARNINGS \
    QT_DISABLE_DEPRECATED_BEFORE=0x050C00 \
    QT_NO_CAST_TO_ASCII \
    QT_NO_PROCESS_COMBINED_ARGUMENT_START \
    QT_NO_URL_CAST_FROM_STRING \
    GIT_REVISION=\\\"$$GIT_REVISION\\\" \
    GIT_DATE=\\\"$$GIT_DATE\\\"
